      <rect x="0" y="28" width="328" height="15" fill="#13243A"/>
      <circle cx="23" cy="22" r="5" fill="#FB7185"/><circle cx="41" cy="22" r="5" fill="#FBBF24"/><circle cx="59" cy="22" r="5" fill="#34D399"/>
