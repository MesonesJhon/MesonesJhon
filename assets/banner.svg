      <text x="24" y="88" fill="#67E8F9" font-size="18" font-family="DejaVu Sans Mono,monospace">const developer = {</text>
      <text x="40" y="123" fill="#BFD7EA" font-size="16" font-family="DejaVu Sans Mono,monospace">focus: <tspan fill="#86EFAC">'full-stack'</tspan>,</text>
      <text x="40" y="153" fill="#BFD7EA" font-size="16" font-family="DejaVu Sans Mono,monospace">mindset: <tspan fill="#86EFAC">'build'</tspan></text>
      <text x="24" y="186" fill="#67E8F9" font-size="18" font-family="DejaVu Sans Mono,monospace">};</text>
      <text x="24" y="220" fill="#6487A6" font-size="14" font-family="DejaVu Sans Mono,monospace">$ git push origin main <tspan fill="#34D399">✓</tspan></text>
